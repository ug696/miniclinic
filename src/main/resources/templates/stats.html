<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>統計資料 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        nav { background: #0F2443; padding: 12px; border-radius: 8px; margin-bottom: 24px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 18px; flex-wrap: nowrap; }
        nav a { color: white; text-decoration: none; font-weight: bold; white-space: nowrap; }
        nav a:hover { color: #5EEAD4; }
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 24px 0; }
        .stat { border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px; }
        .label { color: #64748B; font-size: 14px; margin-bottom: 8px; }
        .number { color: #0F2443; font-size: 32px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        .empty { color: #94A3B8; padding: 24px 0; }
    </style>
</head>
<body>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師清單</a>
        <a th:href="@{/appointment/new}">線上掛號</a>
        <a th:href="@{/patients}">病歷資料</a>
        <a th:href="@{/appointments}">掛號記錄</a>
        <a th:href="@{/stats}">統計資訊</a>
        <a th:href="@{/login}">醫師登入</a>
    </nav>

    <h1>統計資訊</h1>

    <section class="summary">
        <div class="stat">
            <div class="label">醫師總數</div>
            <div class="number" th:text="${doctorCount}">0</div>
        </div>
        <div class="stat">
            <div class="label">病患總數</div>
            <div class="number" th:text="${patientCount}">0</div>
        </div>
        <div class="stat">
            <div class="label">掛號總數</div>
            <div class="number" th:text="${appointmentCount}">0</div>
        </div>
    </section>

    <h2>依科別分組的掛號數</h2>

    <table th:if="${not appointmentCountsByDepartment.isEmpty()}">
        <thead>
            <tr>
                <th>科別</th>
                <th>掛號數</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${appointmentCountsByDepartment}">
                <td th:text="${entry.key}">家醫科</td>
                <td th:text="${entry.value}">0</td>
            </tr>
        </tbody>
    </table>

    <p class="empty" th:if="${appointmentCountsByDepartment.isEmpty()}">目前尚無掛號資料</p>
</body>
</html>
