<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${doctor.name} + ' - MiniClinic'">醫師詳細</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; }
        nav { background: #0F2443; padding: 12px; border-radius: 8px; margin-bottom: 24px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 18px; flex-wrap: nowrap; }
        nav a { color: white; text-decoration: none; font-weight: bold; white-space: nowrap; }
        nav a:hover { color: #5EEAD4; }
        .card { background: #F8FAFC; padding: 24px; border-left: 5px solid #42bead; border-radius: 4px; }
        dt { font-weight: bold; color: #0F2443; margin-top: 12px; }
        dd { margin-left: 0; margin-bottom: 8px; }
        .back { display: inline-block; margin-top: 20px; color: #2ed5c2; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師清單</a>
        <a th:href="@{/appointment/new}">線上掛號</a>
        <a th:href="@{/patients}">病歷資料</a>
        <a th:href="@{/appointments}">掛號記錄</a>
        <a th:href="@{/stats}">統計資訊</a>
        <a th:href="@{/login}">醫師登入</a>
    </nav>

    <h1 th:text="${doctor.name}">醫師姓名</h1>
    <div class="card">
        <dl>
            <dt>醫師編號</dt><dd th:text="${doctor.doctorId}">D001</dd>
            <dt>科別</dt>    <dd th:text="${doctor.department}">家醫科</dd>
            <dt>專長</dt>    <dd th:text="${doctor.specialty}">一般內科</dd>
        </dl>
    </div>
    <a th:href="@{/doctors}" class="back">← 返回清單</a>
</body>
</html>
